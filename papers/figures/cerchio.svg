<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img">
  <title>The circle c² + s² = 1 and the point (3/5, 4/5)</title>
  <desc>The 3-4-5 triangle on the circle. Along the axis n = eₓ the Born weights of Φ|0⟩ are c² = 9/25 and s² = 16/25, and they sum to 1.</desc>
  <rect width="860" height="560" fill="#faf8f4"/>
  <style>
    text { font-family: Palatino, "Palatino Linotype", Georgia, serif; fill: #1a1814; }
    .axis { stroke: #1a1814; stroke-width: 1.4; fill: none; }
    .circle { fill: none; stroke: #1a1814; stroke-width: 1.6; }
    .leg { stroke: #8c3a2f; stroke-width: 2; fill: none; }
    .point { fill: #8c3a2f; }
    .bar { fill: #1a1814; }
    .guide { stroke: #b8b0a2; stroke-width: 1; stroke-dasharray: 4 4; }
    .label { font-size: 20px; }
    .small { font-size: 16px; }
    .mid { text-anchor: middle; }
  </style>
  <text class="label" x="40" y="44">c² + s² = 1</text>
  <line class="axis" x1="40" y1="300" x2="470" y2="300"/>
  <line class="axis" x1="240" y1="510" x2="240" y2="70"/>
  <polygon points="470,300 458,294 458,306" fill="#1a1814"/>
  <polygon points="240,70 234,82 246,82" fill="#1a1814"/>
  <circle class="circle" cx="240" cy="300" r="200"/>
  <path class="leg" d="M 240 300 H 360 V 140"/>
  <path d="M 348 300 V 288 H 360" fill="none" stroke="#8c3a2f" stroke-width="1.4"/>
  <circle class="point" cx="360" cy="140" r="5.5"/>
  <text class="label" x="478" y="306">c</text>
  <text class="label" x="252" y="80">s</text>
  <text class="small mid" x="300" y="324">3/5</text>
  <text class="small" x="368" y="226">4/5</text>
  <text class="label" x="372" y="128">(3/5, 4/5)</text>

  <text class="small" x="560" y="44">Born weights of Φ|0⟩, axis n = eₓ</text>
  <line class="axis" x1="560" y1="420" x2="820" y2="420"/>
  <line class="guide" x1="560" y1="100" x2="820" y2="100"/>
  <text class="small" x="826" y="105">1</text>
  <rect class="bar" x="596" y="304.8" width="64" height="115.2"/>
  <rect class="bar" x="716" y="215.2" width="64" height="204.8"/>
  <text class="small mid" x="628" y="294">9/25</text>
  <text class="small mid" x="748" y="204">16/25</text>
  <text class="small mid" x="628" y="446">P(0) = c²</text>
  <text class="small mid" x="748" y="446">P(1) = s²</text>
  <text class="small" x="560" y="490">9/25 + 16/25 = 1</text>
</svg>
