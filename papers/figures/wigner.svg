<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img">
  <title>Wigner's friend: the friend's measurement can be undone until Wigner copies the record</title>
  <desc>Two circuits on system, friend and Wigner, starting from Φ|0⟩ ⊗ |0⟩ ⊗ |0⟩ at c = 3/5, s = 4/5, n = eₓ. Left: the friend measures with a CNOT, then the same CNOT undoes it: the system's coherence is 12/25 i again and its purity 1. Right: the friend measures, Wigner copies the friend's record with a CNOT, then the friend's CNOT is applied again: the system's coherence stays 0, its purity 337/625, and Wigner reads 9/25 and 16/25.</desc>
  <rect width="920" height="500" fill="#faf8f4"/>
  <style>
    text { font-family: Palatino, "Palatino Linotype", Georgia, serif; fill: #1a1814; }
    .wire { stroke: #1a1814; stroke-width: 1.6; fill: none; }
    .target { fill: none; stroke: #1a1814; stroke-width: 1.6; }
    .copy { stroke: #8c3a2f; }
    .head { font-size: 18px; }
    .label { font-size: 17px; }
    .small { font-size: 15px; }
    .tiny { font-size: 13px; }
    .muted { fill: #6b6458; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .lemma { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 13px; fill: #8c3a2f; }
  </style>

  <!-- left: undo before the copy -->
  <text class="head" x="36" y="44">undo before the copy</text>
  <text class="small end" x="108" y="125">system</text>
  <text class="small end" x="108" y="195">friend</text>
  <text class="small end" x="108" y="265">Wigner</text>
  <line class="wire" x1="118" y1="120" x2="420" y2="120"/>
  <line class="wire" x1="118" y1="190" x2="420" y2="190"/>
  <line class="wire" x1="118" y1="260" x2="420" y2="260"/>
  <text class="tiny muted mid" x="150" y="108">Φ|0⟩</text>
  <text class="tiny muted mid" x="150" y="178">|0⟩</text>
  <text class="tiny muted mid" x="150" y="248">|0⟩</text>

  <line class="wire" x1="220" y1="120" x2="220" y2="203"/>
  <circle cx="220" cy="120" r="6" fill="#1a1814"/>
  <circle class="target" cx="220" cy="190" r="13"/>
  <line class="wire" x1="207" y1="190" x2="233" y2="190"/>
  <text class="tiny muted mid" x="220" y="82">friend measures</text>

  <line class="wire" x1="330" y1="120" x2="330" y2="203"/>
  <circle cx="330" cy="120" r="6" fill="#1a1814"/>
  <circle class="target" cx="330" cy="190" r="13"/>
  <line class="wire" x1="317" y1="190" x2="343" y2="190"/>
  <text class="tiny muted mid" x="330" y="82">Wigner undoes it</text>

  <text class="small" x="36" y="322">the lab is back to Φ|0⟩ ⊗ |0⟩ ⊗ |0⟩</text>
  <text class="label" x="36" y="354">system: coherence 12/25 i, purity 1</text>
  <text class="tiny muted" x="36" y="378">the measurement was not a fact for Wigner</text>
  <text class="lemma" x="36" y="402">friend_undone, point_undone</text>

  <line x1="460" y1="30" x2="460" y2="410" stroke="#b8b0a2" stroke-width="1"/>

  <!-- right: undo after the copy -->
  <text class="head" x="500" y="44">undo after the copy</text>
  <text class="small end" x="572" y="125">system</text>
  <text class="small end" x="572" y="195">friend</text>
  <text class="small end" x="572" y="265">Wigner</text>
  <line class="wire" x1="582" y1="120" x2="884" y2="120"/>
  <line class="wire" x1="582" y1="190" x2="884" y2="190"/>
  <line class="wire" x1="582" y1="260" x2="884" y2="260"/>

  <line class="wire" x1="640" y1="120" x2="640" y2="203"/>
  <circle cx="640" cy="120" r="6" fill="#1a1814"/>
  <circle class="target" cx="640" cy="190" r="13"/>
  <line class="wire" x1="627" y1="190" x2="653" y2="190"/>
  <text class="tiny muted mid" x="640" y="82">friend measures</text>

  <line class="wire copy" x1="740" y1="190" x2="740" y2="273" style="stroke:#8c3a2f"/>
  <circle cx="740" cy="190" r="6" fill="#8c3a2f"/>
  <circle class="target" cx="740" cy="260" r="13" style="stroke:#8c3a2f"/>
  <line class="wire" x1="727" y1="260" x2="753" y2="260" style="stroke:#8c3a2f"/>
  <text class="tiny mid" x="740" y="82" style="fill:#8c3a2f">Wigner copies</text>

  <line class="wire" x1="840" y1="120" x2="840" y2="203"/>
  <circle cx="840" cy="120" r="6" fill="#1a1814"/>
  <circle class="target" cx="840" cy="190" r="13"/>
  <line class="wire" x1="827" y1="190" x2="853" y2="190"/>
  <text class="tiny muted mid" x="840" y="100">undo</text>

  <text class="small" x="500" y="322">the lab ends in α|000⟩ + β|101⟩</text>
  <text class="label" x="500" y="354">system: coherence 0, purity 337/625</text>
  <text class="tiny muted" x="500" y="378">Wigner still reads 9/25 and 16/25</text>
  <text class="lemma" x="500" y="402">copy_irreversible, point_copied</text>

  <line x1="36" y1="430" x2="884" y2="430" stroke="#b8b0a2" stroke-width="1"/>
  <text class="small" x="36" y="458">A measurement is a relation between the system and the copies of its record: once copied, undoing the friend alone no longer helps.</text>
  <text class="tiny muted" x="36" y="480">Φ|0⟩ at c = 3/5, s = 4/5, n = eₓ: α = 3/5, β = −4/5 i · Wigner reading the friend reads the system (chain_is_fanout)</text>
</svg>
