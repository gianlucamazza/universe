[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universe"
version = "0.4.0"
description = "Kernel esatto di un universo: stato, legge, osservabile."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = ["mypy==2.4.0", "pytest>=8", "ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["universe*"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.mypy]
files = ["universe"]
strict_equality = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
